# Render Blueprint — New > Blueprint, pick this repo, and Render creates both services.
databases:
  - name: feedback-db
    plan: free
    databaseName: feedback
    user: feedback

services:
  - type: web
    name: feedback-platform
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: feedback-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: APP_TIME_ZONE
        value: Asia/Kuwait
      - key: DJANGO_ADMIN_USERNAME
        sync: false
      - key: DJANGO_ADMIN_PASSWORD
        sync: false
